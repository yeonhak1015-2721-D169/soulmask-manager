name: Build Android APK

# ─────────────────────────────────────────────────────────────
# GitHub App 권한(workflows) 때문에 이 워크플로 파일은 자동으로 올릴 수 없습니다.
# 저장소에 .github/workflows/build-android-apk.yml 로 복사해서 한 번만 추가하면,
# 그 뒤로는 main에 변경이 생길 때마다 APK가 자동 빌드됩니다.
# ─────────────────────────────────────────────────────────────

# 이 파일을 저장소의 `.github/workflows/build-android-apk.yml` 로 올리면
# main 브랜치에 웹 파일이 바뀔 때마다 안드로이드 APK가 자동으로 빌드됩니다.
# 빌드 로직은 scripts/build-android-apk.sh 에 있습니다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.json'
      - 'sw.js'
      - 'scripts/build-android-apk.sh'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Soulmask Planner APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-android-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soulmask-Planner-apk
          path: dist/Soulmask-Planner.apk
          if-no-files-found: error
          retention-days: 90
