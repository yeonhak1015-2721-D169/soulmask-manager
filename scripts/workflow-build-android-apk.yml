name: Build Android APK

# GitHub App 권한(workflows) 때문에 이 워크플로 파일은 자동으로 커밋할 수 없습니다.
# 저장소에 `.github/workflows/build-android-apk.yml` 로 한 번만 올리면,
# 그 뒤로는 main에 웹 파일이 바뀔 때마다 안드로이드 APK가 자동으로 빌드됩니다.
# 실제 빌드 로직은 scripts/build-android-apk.sh 에 있습니다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.json'
      - 'sw.js'
      - 'scripts/build-android-apk.sh'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 디버그 서명 키를 빌드마다 재사용해서, 새 APK를 기존 앱 위에 그대로 설치할 수 있게 함
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Build Soulmask Planner APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-android-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soulmask-Planner-apk
          path: dist/Soulmask-Planner.apk
          if-no-files-found: error
          retention-days: 90
