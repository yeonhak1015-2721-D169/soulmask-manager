<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>Soulmask Planner · 소울마스크 기획 보드</title>
<meta name="description" content="소울마스크 플레이 기록·부족원·보스·자원·유튜브 기획을 한 화면에서 관리하는 하기로그 기획 보드">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soulmask Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<a class="skip-link" href="#view-root">본문으로 건너뛰기</a>

<div class="app">
  <aside class="sidebar" aria-label="주 메뉴">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🪓</span>
      <span class="brand-text">
        <strong>Soulmask</strong>
        <em>Planner</em>
      </span>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <div class="side-status">
        <span class="dot" id="side-dot" aria-hidden="true"></span>
        <span id="side-storage">자동 저장</span>
      </div>
      <button type="button" class="sync-chip" id="sync-chip" data-act="open-sync" title="클라우드 동기화 설정">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="sync-chip-text">동기화 꺼짐</span>
      </button>
      <p class="side-note">하기 로그 · 개인 기획 보드</p>
    </div>
  </aside>

  <div class="main">
    <div class="banner" id="storage-banner" hidden>
      <p id="storage-banner-text">브라우저 저장소를 사용할 수 없습니다. 설정에서 백업을 내려받아 두세요.</p>
    </div>
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">대시보드</h1>
        <p id="view-sub" class="view-sub"></p>
      </div>
      <div class="topbar-right">
        <span class="today-chip" id="today-chip"></span>
        <button type="button" class="icon-btn" data-act="open-sync" aria-label="동기화 설정" title="동기화 설정">☁</button>
      </div>
    </header>
    <main id="view-root" class="view-root" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="빠른 메뉴"></nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="전체 메뉴">
    <div class="sheet-head">
      <h2>전체 메뉴</h2>
      <button type="button" class="icon-btn" data-act="close-sheet" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-grid" id="sheet-grid"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">제목</h2>
      <button type="button" class="icon-btn" data-modal="cancel" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script type="module" src="./js/app.js"></script>
</body>
</html>
